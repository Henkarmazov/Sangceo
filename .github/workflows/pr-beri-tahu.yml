name: Kabari penjaga

# Pemicu secepat mungkin setelah PR dibuka atau diubah.
#
# Pekerjaannya kosong dengan sengaja. Workflow yang dipicu pull_request dari fork
# hanya menerima token baca-saja, jadi tidak bisa merge. Tetapi begitu run ini
# selesai, pr-jaga.yml ikut dijalankan lewat workflow_run, dan di sana izinnya penuh
# karena berjalan di repo ini. Hasilnya: PR baru ditangani dalam hitungan detik,
# bukan menunggu jadwal berikutnya.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  beri-tahu:
    runs-on: ubuntu-latest
    steps:
      - run: echo "PR #${{ github.event.pull_request.number }} siap diperiksa penjaga."
